name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: pytest + ruff (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff
      - name: Ruff lint
        run: ruff check panelpro
      - name: Compile check
        run: python -m compileall panelpro
      - name: Install Nginx for deployment smoke tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nginx
          for script in scripts/*.sh; do bash -n "$script"; done
      - name: Run tests
        env:
          PANELPRO_HOME: ${{ runner.temp }}/panelpro-home
        run: python -m pytest -v
      - name: Verify native phpMyAdmin installation
        if: runner.os == 'Linux' && matrix.python == '3.12'
        run: |
          sudo systemctl start nginx.service
          sudo env PANELPRO_HOME="$RUNNER_TEMP/panelpro-app-smoke" \
            PANELPRO_WWW_ROOT="$RUNNER_TEMP/panelpro-app-smoke/www" \
            "$(command -v python)" -m panelpro install-app phpmyadmin
          curl -fsS http://127.0.0.1:8881/ -o "$RUNNER_TEMP/phpmyadmin.html"
          grep -q 'pma_username' "$RUNNER_TEMP/phpmyadmin.html"
          ss -ltn 'sport = :8881' | grep -F '127.0.0.1:8881'
