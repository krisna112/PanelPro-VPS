<!doctype html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>PanelPro</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/panel.css">
  <link rel="stylesheet" href="/assets/vendor/xterm.min.css"
        onerror="this.remove()">
</head>
<body>
  <div id="app"></div>

  <!-- Core libraries: local vendor copy first (scripts/vendor_assets.sh),
       CDN fallback for quick starts. -->
  <script src="/assets/vendor/vue.global.prod.js"></script>
  <script>window.Vue || document.write('<script src="https://cdn.jsdelivr.net/npm/vue@3.4.38/dist/vue.global.prod.js"><\/script>')</script>
  <script src="/assets/vendor/vue-router.global.prod.js"></script>
  <script>window.VueRouter || document.write('<script src="https://cdn.jsdelivr.net/npm/vue-router@4.4.3/dist/vue-router.global.prod.js"><\/script>')</script>
  <script src="/assets/vendor/xterm.min.js" onerror="window.__noXterm=true"></script>
  <script>window.xterm || document.write('<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"><\/script>')</script>
  <script src="/assets/vendor/xterm-fit.min.js" onerror="window.__noXtermFit=true"></script>

  <!-- PanelPro application (no build step — plain scripts, PP.* namespace) -->
  <script>window.PP = window.PP || { pages: {} };
  window.__errs = [];
  window.addEventListener("error", function (e) {
    window.__errs.push(String(e.message) + " @ " + String(e.filename || "") + ":" + e.lineno);
  });</script>
  <script src="/assets/js/i18n.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/store.js"></script>

  <script src="/assets/js/pages/databases.js"></script>
  <script src="/assets/js/pages/php.js"></script>
  <script src="/assets/js/pages/ftp.js"></script>
  <script src="/assets/js/pages/files.js"></script>
  <script src="/assets/js/pages/ssl.js"></script>
  <script src="/assets/js/pages/security.js"></script>

  <script src="/assets/js/pages/docker.js"></script>
